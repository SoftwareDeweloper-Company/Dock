/* рейтинг 1–10: 75% — надёжность (каждая смерть дорого), 25% — скорость пути */
function apRating(st){
  var succ = st.ok/st.n;
  var sp = Math.sqrt(Math.max(0, Math.min(1, st.eff/0.8)));
  var sc = 0.75*succ*succ + 0.25*sp;
  return Math.max(1, Math.min(10, Math.round(sc*10)));
}
/* один полный прогон режима: n игр до target яблок; sync-версия для тестов */
function apBenchMode(mode, WW, HH, n, target, tmax, onRun, prm){
  var res = { mode:mode, n:n, ok:0, apples:0, time:0, dist:0, ideal:0, fails:[], runs:[] };
  for(var run=0; run<n; run++){
    var w = apSimNew(WW, HH, 1000 + run*7919, prm), A = apSimCtx(mode, w);
    while(!w.dead && w.eaten < target && w.t < tmax) apSimStep(A, w, 1/45);
    var ok = !w.dead && w.eaten >= target;
    if(ok){ res.ok++; res.time += w.t; }
    res.apples += w.eaten; res.dist += w.dist; res.ideal += w.ideal;
    if(!ok) res.fails.push({ run:run, why:w.dead ? w.why : 'timeout', eaten:w.eaten, t:Math.round(w.t) });
    res.runs.push({ ok:ok, eaten:w.eaten, t:w.t, why:w.why });
    if(onRun) onRun(res, run);
  }
  apBenchFinish(res, target);
  return res;
}
function apBenchFinish(res, target){
  res.effRaw = res.dist > 0 ? res.ideal/res.dist : 0;
  res.eff = Math.min(1, res.effRaw);
  res.tpa = res.ok > 0 ? res.time/(res.ok*target) : 0;     /* секунд на яблоко (по успешным) */
  res.rating = apRating(res);
}

/* =====================================================================
   GERMAN AI — подключение к игре, отладка, панель DEV, тест 20×20
   ===================================================================== */
var AP = apNew('off');
AP.steerFn = function(dx, dy){ steer(dx, dy); };
AP.growFn = function(){ return G.CS*(S.dev.on ? S.dev.growth : 1.8); };
if(!AP_NAMES[S.dev.ai]) S.dev.ai = 'off';

function apWanted(){
  if(G.state === 'play' && S.dev.on && AP_NAMES[S.dev.ai]){ AP.mode = S.dev.ai; return true; }
  return false;
}
function apReset(){
  AP.dirty = true; AP.last = -1; AP.eaten = 0; AP.dec = 0; AP.fb = 0; AP.path = null; AP.bl = G.bodyLen;
}
function apFrame(){
  var L = AP.L;
  if(L && (L.CS !== G.CS || L.T !== G.T || L.W !== W || L.H !== H || L.mode !== AP.mode)) AP.dirty = true;
  if(G.bodyLen > AP.bl + 1) AP.eaten++;
  AP.bl = G.bodyLen;
  if(S.dev.debug && AP.L) apFan(AP, G);
}

/* ---------- отладочная отрисовка: метки, путь, цикл, лучи ---------- */
function apDraw(){
  var A = AP, L = A.L;
  if(!L || !S.dev.on || !AP_NAMES[S.dev.ai]) return;
  var i, n, x, y;
  ctx.save();
  /* метки сетки: зелёные — свободны, красные — заняты телом */
  ctx.fillStyle = 'rgba(120,255,170,.38)'; ctx.beginPath();
  for(n=0; n<L.N; n++){ if(!(L.vx[n] > 0)){ x = apNX(L, n); y = apNY(L, n); ctx.rect(x-1.4, y-1.4, 2.8, 2.8); } }
  ctx.fill();
  ctx.fillStyle = 'rgba(255,90,90,.85)'; ctx.beginPath();
  for(n=0; n<L.N; n++){ if(L.vx[n] > 0){ x = apNX(L, n); y = apNY(L, n); ctx.rect(x-1.8, y-1.8, 3.6, 3.6); } }
  ctx.fill();
  /* гамильтонов цикл */
  if(AP.mode === 'ham' && L.N2 > 3 && L.cycOK){
    ctx.strokeStyle = 'rgba(255,224,102,.22)'; ctx.lineWidth = 1; ctx.beginPath();
    for(i=0; i<=L.N2; i++){
      n = L.cyc[i % L.N2]; x = apNX(L, n); y = apNY(L, n);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    var h = L.idx[apNode(L, G.hx, G.hy)];
    if(h >= 0){
      ctx.strokeStyle = 'rgba(255,224,102,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(G.hx, G.hy);
      for(i=1; i<=8; i++){ n = L.cyc[(h+i) % L.N2]; ctx.lineTo(apNX(L, n), apNY(L, n)); }
      ctx.stroke();
    }
  }
  /* маршрут A* */
  if(A.path && A.path.length > 1){
    ctx.strokeStyle = 'rgba(80,230,255,.95)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(G.hx, G.hy);
    for(i=1; i<A.path.length; i++){ ctx.lineTo(apNX(L, A.path[i]), apNY(L, A.path[i])); }
    ctx.stroke();
    var e = A.path[A.path.length-1];
    ctx.beginPath(); ctx.arc(apNX(L, e), apNY(L, e), 5, 0, TAU); ctx.stroke();
  }
  /* лучи от головы */
  if(A.rays){
    ctx.font = 'bold 10px monospace'; ctx.lineWidth = 1.6;
    for(i=0; i<A.rays.length; i++){
      var r = A.rays[i], k = Math.max(0, Math.min(1, r.len/r.max));
      var col = 'hsl(' + Math.round(k*120) + ',95%,58%)';
      var ex = G.hx + r.ux*r.len, ey = G.hy + r.uy*r.len;
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(G.hx, G.hy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey, 3, 0, TAU); ctx.fill();
      ctx.fillText((r.len/G.CS).toFixed(1), ex + 5, ey - 4);
    }
  }
  ctx.restore();
}
function apDbgText(){
  if(!AP_NAMES[S.dev.ai] || !AP.L) return '';
  var L = AP.L;
  var t = '\nGERMAN AI ' + AP_NAMES[S.dev.ai] + ' · сетка ' + L.cols + '×' + L.rows + ' шаг ' + L.c.toFixed(1) + 'px' +
          '\nрешений ' + AP.dec + ' · яблок ' + AP.eaten + ' · откатов ' + AP.fb;
  if(AP.mode === 'ham') t += '\nцикл ' + (L.cycOK ? 'OK' : 'нет') + ' · S0 ' + L.S0 + '/' + L.N2 + (AP.pick > 1 ? ' · срез +' + AP.pick : '');
  if(AP.rays && AP.rays.length) t += '\nлучи (клетки): ' + AP.rays.map(function(r){ return (r.len/G.CS).toFixed(1); }).join(' ');
  return t;
}

/* ---------- тест: 20 игр × 20 яблок, две серии ---------- */
var AP_BKEY = 'hyperSnakeGermanAI_v2';
var AP_LONG = { startLen:60, growth:3 };           /* серия «длинная змея» */
var AP_BAKED = {"astar":{"rating":10,"ok0":20,"ok1":20,"n":20,"tpa":1.9,"eff":1,"size":"360×800"},"ham":{"rating":9.4,"ok0":20,"ok1":20,"n":20,"tpa":4.2,"eff":0.46,"size":"360×800"},"ray":{"rating":10,"ok0":20,"ok1":20,"n":20,"tpa":1.9,"eff":1,"size":"360×800"}};
var AP_RATE = apLoadRates();
var APB = null;
function apLoadRates(){
  var r = {}, k;
  for(k in AP_BAKED) r[k] = AP_BAKED[k];
  try{
    var s = JSON.parse(localStorage.getItem(AP_BKEY) || 'null');
    if(s) for(k in s) if(AP_NAMES[k]) r[k] = s[k];
  }catch(e){}
  return r;
}
/* рейтинг 1–10: 75% — надёжность (серия «длинная змея» весит больше), 25% — скорость пути */
function apRate2(r){
  var s0 = r.ok0/r.n, s1 = r.ok1/r.n;
  var safety = 0.35*s0*s0*s0 + 0.65*s1*s1*s1;
  var sp = Math.sqrt(Math.max(0, Math.min(1, r.effRaw/0.8)));
  var sc = 0.75*safety + 0.25*sp;
  return Math.max(1, Math.min(10, Math.round(sc*100)/10));
}
function apBenchNew(WW, HH){
  var B = { WW:WW, HH:HH, mi:0, phase:0, run:0, w:null, A:null, res:{}, done:false, ticks:0 };
  for(var i=0; i<AP_ORDER.length; i++)
    B.res[AP_ORDER[i]] = { mode:AP_ORDER[i], n:20, ok0:0, ok1:0, time:0, dist:0, ideal:0, fails:[] };
  return B;
}
/* один «кусок» работы теста; budgetMs — сколько миллисекунд можно потратить */
function apBenchStep(B, budgetMs){
  var t0 = performance.now(), mode, r, w, q;
  while(!B.done && performance.now() - t0 < budgetMs){
    if(B.mi >= AP_ORDER.length){ B.done = true; break; }
    mode = AP_ORDER[B.mi];
    if(!B.w){
      B.w = apSimNew(B.WW, B.HH, 1000 + B.run*7919, B.phase === 1 ? AP_LONG : null);
      B.A = apSimCtx(mode, B.w);
    }
    w = B.w;
    for(q=0; q<30; q++){
      apSimStep(B.A, w, 1/45);
      if(w.dead || w.eaten >= 20 || w.t > 1500) break;
    }
    if(w.dead || w.eaten >= 20 || w.t > 1500){
      r = B.res[mode];
      var ok = !w.dead && w.eaten >= 20;
      if(B.phase === 0){
        if(ok){ r.ok0++; r.time += w.t; }
        r.dist += w.dist; r.ideal += w.ideal;
      } else if(ok) r.ok1++;
      if(!ok) r.fails.push({ ph:B.phase, run:B.run, why:w.dead ? w.why : 'timeout', eaten:w.eaten });
      B.w = null;
      if(++B.run >= r.n){
        B.run = 0;
        if(B.phase === 0) B.phase = 1;
        else {
          B.phase = 0; B.mi++;
          r.effRaw = r.dist > 0 ? r.ideal/r.dist : 0;
          r.tpa = r.ok0 > 0 ? r.time/(r.ok0*20) : 0;
          r.rating = apRate2(r);
        }
      }
    }
  }
  return B.done;
}
function apRateRow(r, size){
  return { rating:r.rating, ok0:r.ok0, ok1:r.ok1, n:r.n, tpa:+r.tpa.toFixed(1), eff:+Math.min(1, r.effRaw).toFixed(2), size:size };
}
function apBenchStart(){
  if(APB) return;
  APB = apBenchNew(Math.round(W), Math.round(H));
  apBenchUI();
  setTimeout(apBenchTick, 30);
}
function apBenchStop(){ if(APB){ APB.stop = true; } }
function apBenchTick(){
  var B = APB; if(!B) return;
  if(B.stop){ APB = null; apBenchUI(); apSyncUI(); toast('Тест остановлен'); return; }
  if(apBenchStep(B, 14)){
    var out = {}, k;
    for(k in B.res) out[k] = apRateRow(B.res[k], B.WW + '×' + B.HH);
    for(k in out) AP_RATE[k] = out[k];
    try{ localStorage.setItem(AP_BKEY, JSON.stringify(out)); }catch(e){}
    APB = null; apBenchUI(); apSyncUI();
    toast('Тест GERMAN AI готов');
    return;
  }
  if((++B.ticks & 7) === 0) apBenchUI();
  setTimeout(apBenchTick, 0);
}
function apBenchUI(){
  var el = document.getElementById('aiBenchTxt'), bt = document.getElementById('aiBenchBtn');
  if(!el) return;
  if(APB){
    var B = APB, m = AP_ORDER[Math.min(B.mi, AP_ORDER.length-1)];
    var part = (B.phase === 0 ? 'обычная змея ' : 'длинная змея ') + (B.run+1) + '/20';
    el.innerHTML = '<b>Тест идёт…</b> ' + AP_NAMES[m] + ' · ' + part + ' · режим ' + (B.mi+1) + '/' + AP_ORDER.length;
    bt.textContent = '■ Остановить'; bt.setAttribute('data-act', 'aiStop');
  } else {
    bt.textContent = '▶ Тест: 20 игр × 20 яблок'; bt.setAttribute('data-act', 'aiBench');
  }
}

/* ---------- панель в DEV ---------- */
function aiCard(id, t, d){
  return '<button class="pcard" data-ai="' + id + '"><b>' + t + '<i class="airate" data-rate="' + id + '"></i></b>' +
         '<span>' + d + '</span><span class="aistat" data-stat="' + id + '"></span></button>';
}
function apSettingsHtml(){
  var h = '<div class="aibox"><div class="rl">&#129302; GERMAN AI — автопилот</div>' +
    '<div class="rd">Ведёт змею сам: не бьётся о края и о себя, собирает яблоки. Пока выбран режим, ручное управление отключено. ' +
    'Невидимая сетка-метки, маршрут и лучи видны при включённой «Отладке». Смена режима начинает новую игру.</div>' +
    '<div class="mgrid">';
  h += aiCard('off', 'Выкл', 'Обычное ручное управление.');
  h += aiCard('astar', 'A*', 'Кратчайший путь по невидимой сетке. Хвост считается движущимся: клетки, которые он освободит, уже можно занимать. Перед выбором пути проверяет «выход к хвосту».');
  h += aiCard('ham', 'Гельмальт', 'Гамильтонов цикл по невидимым меткам: обходит всё поле по кругу и режет путь к яблоку, когда это безопасно. Самый надёжный на длинной змее.');
  h += aiCard('ray', 'Лучевой', 'Кусочек A* ищет яблоко, а лучи от головы (вперёд, ±45°, ±90°) в реальном времени меряют расстояние до стен и тела. Лучи видны в Отладке.');
  h += '</div><div class="btnrow"><button class="sbtn" id="aiBenchBtn" data-act="aiBench">▶ Тест: 20 игр × 20 яблок</button></div>' +
       '<div class="summary" id="aiBenchTxt"></div>' +
       '<div class="rd" style="margin-top:6px">Рейтинг 1–10 = 75% надёжность + 25% скорость пути. Тест: по 20 игр до 20 яблок, две серии — обычная змея и «длинная змея» ' +
       '(старт 60 сегм., рост ×3; там надёжность весит больше). Числа по умолчанию посчитаны при разработке на поле 360×800, кнопка перепроверяет на твоём экране.</div></div>';
  return h;
}
function apSyncUI(){
  var cards = document.querySelectorAll('[data-ai]'), i, id, r, el;
  for(i=0; i<cards.length; i++){
    id = cards[i].getAttribute('data-ai');
    cards[i].classList.toggle('on', S.dev.ai === id);
    r = AP_RATE[id];
    el = cards[i].querySelector('.airate');
    if(el) el.textContent = r ? '★ ' + (+r.rating.toFixed(1)) + '/10' : '';
    el = cards[i].querySelector('.aistat');
    if(el) el.textContent = r ? 'Тест 20×20: ' + r.ok0 + '/' + r.n + ' · длинная змея: ' + r.ok1 + '/' + r.n + ' · ' + r.tpa + ' с на яблоко' : '';
  }
  apBenchUI();
}
function apPick(id){
  if(id !== 'off' && !AP_NAMES[id]) return;
  if(APB) return;
  var wasOn = S.dev.on;
  S.dev.ai = id;
  AP.mode = id; AP.dirty = true;
  if(id !== 'off' && !S.dev.on){ S.dev.on = true; applyDev('dev.on'); }
  queueSave(); syncUI();
  if(G.CS){ G.state = 'ready'; reset(true); refreshCard(); }
  toast(id === 'off' ? 'GERMAN AI выключен' : 'GERMAN AI: ' + AP_NAMES[id] + (wasOn ? '' : ' · DEV включён') + ' — нажми ИГРАТЬ');
}


/* ---------- старт ---------- */
G.wrap = wantWrap();
G.best = loadBest();
qchip.classList.toggle('on', S.showFps);
buildPad();
resize();
reset(true);
startScreen();
requestAnimationFrame(frame);
})();
